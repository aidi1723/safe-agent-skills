[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "onecode-skill-sanitizer"
version = "0.1.0"
description = "Local skill intake, taxonomy, and risk scanner for OneCode"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["ruff>=0.8"]

[project.scripts]
onecode-skill-sanitizer = "onecode_skill_sanitizer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 120
extend-exclude = [".worktrees"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
